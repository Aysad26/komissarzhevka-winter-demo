<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f7f6f4">
  <title>Сравнение мобильных шапок — Театр им. В. Ф. Комиссаржевской</title>
  <style>
    :root { color-scheme: light; --screen: 390px; --bar: 84px; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f7f6f4; color: #2b2829; font: 15px/1.4 Roboto, Arial, sans-serif; }
    main { width: calc(100% - 40px); max-width: calc(var(--screen) * 2 + 32px); margin: clamp(32px, 8vh, 76px) auto; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; padding-bottom: 19px; border-bottom: 1px solid #dcd8d4; }
    h1, h2 { margin: 0; }
    h1 { font-size: clamp(26px, 3.6vw, 37px); line-height: 1.05; letter-spacing: -.035em; }
    fieldset { margin: 0; padding: 0; border: 0; }
    legend { margin-bottom: 4px; padding: 0; font-size: 12px; color: #625b5c; }
    .options { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid #d9d4d2; border-radius: 4px; background: #fff; }
    .options label { position: relative; cursor: pointer; }
    .options input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
    .options span { display: block; min-width: 42px; padding: 5px 8px; border-radius: 2px; text-align: center; font-size: 13px; }
    .options input:checked + span { color: #783b4b; background: #f3e8eb; font-weight: 600; }
    .options input:focus-visible + span, a:focus-visible { outline: 2px solid #783b4b; outline-offset: 2px; }
    .samples { display: flex; flex-wrap: wrap; gap: 28px 32px; justify-content: center; margin-top: 23px; }
    section { width: var(--screen); max-width: 100%; }
    h2 { margin-bottom: 9px; font-size: 16px; font-weight: 600; }
    h2 a { color: inherit; text-decoration: none; }
    h2 a:hover { color: #783b4b; text-decoration: underline; }
    h2 svg { width: 12px; height: 12px; margin-left: 2px; stroke: #71696b; }
    .window { position: relative; overflow: clip; width: 100%; height: var(--display-height, var(--bar)); outline: 1px solid #dedad7; background: #fff; }
    iframe { display: block; width: var(--screen); height: 844px; border: 0; pointer-events: none; transform-origin: top left; transform: scale(var(--scale, 1)); }
  </style>
</head>
<body>
  <main>
    <div class="toolbar">
      <h1>Мобильная шапка</h1>
      <fieldset>
        <legend>Ширина экрана, px</legend>
        <div class="options">
          <label><input type="radio" name="width" value="320" data-height="84"><span>320</span></label>
          <label><input type="radio" name="width" value="390" data-height="84" checked><span>390</span></label>
          <label><input type="radio" name="width" value="768" data-height="106"><span>768</span></label>
          <label><input type="radio" name="width" value="1024" data-height="118"><span>1024</span></label>
        </div>
      </fieldset>
    </div>
    <div class="samples">
      <section>
        <h2><a href="https://www.teatrvfk.ru/afisha/" target="_blank" rel="noopener">Действующий сайт <svg viewBox="0 0 12 12" fill="none" aria-hidden="true" focusable="false"><path d="M2 10L10 2M3 2h7v7" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></a></h2>
        <div class="window" inert>
          <iframe title="Мобильная шапка действующего сайта" src="https://www.teatrvfk.ru/afisha/" sandbox="allow-same-origin" referrerpolicy="no-referrer" width="390" height="844" scrolling="no" tabindex="-1"></iframe>
        </div>
      </section>
      <section>
        <h2><a href="../" target="_blank" rel="noopener">Новогоднее демо <svg viewBox="0 0 12 12" fill="none" aria-hidden="true" focusable="false"><path d="M2 10L10 2M3 2h7v7" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></a></h2>
        <div class="window" inert>
          <iframe title="Мобильная шапка с новогодней анимацией" src="../" width="390" height="844" scrolling="no" tabindex="-1"></iframe>
        </div>
      </section>
    </div>
  </main>
  <script>
    const windows = Array.from(document.querySelectorAll(".window"));
    const controls = document.querySelector("fieldset");
    function fitPreviews() {
      const selected = controls.querySelector(":checked");
      const width = Number(selected.value);
      const height = Number(selected.dataset.height);
      document.documentElement.style.setProperty("--screen", width + "px");
      document.documentElement.style.setProperty("--bar", height + "px");
      for (const panel of windows) {
        const scale = Math.min(1, panel.clientWidth / width);
        panel.style.setProperty("--scale", scale);
        panel.style.setProperty("--display-height", height * scale + "px");
      }
    }
    controls.addEventListener("change", fitPreviews);
    const observer = new ResizeObserver(fitPreviews);
    windows.forEach(panel => observer.observe(panel));
    fitPreviews();
  </script>
</body>
</html>
